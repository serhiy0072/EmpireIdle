# .github/workflows/dotnet.yml
name: build-and-test

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # head_ref || ref_name замість ref: інакше push у phase/* з відкритим PR
  # дає ДВА повні прогони (push + pull_request), обидва з Testcontainers.
  # Так вони потрапляють в одну групу.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # На main не скасовуємо: проміжний коміт лишився б без статусу білду
  # (а це саме те, що пропустило зламаний ServerJobRunner).
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EmpireIdle.slnx

      - name: Build
        run: dotnet build EmpireIdle.slnx --no-restore --configuration Release

      # Domain + Application + Architecture — без Docker і без хоста, біжать завжди
      - name: Unit tests
        run: >
          dotnet test EmpireIdle.slnx --no-build --configuration Release
          --filter "FullyQualifiedName!~EmpireIdle.Api.Tests"
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      # Api.Tests піднімають реальний хост через WebApplicationFactory, тому їм
      # потрібен той самий конфіг, що й застосунку. Локально він у User Secrets,
      # у CI — тут. Ключ підписує токени лише в тестовому процесі, який живе
      # секунди й не має даних, тому секретом його робити нема сенсу.
      #
      # Рядок підключення — заглушка: TestApiFactory підмінить його на
      # контейнерний, але Program перевіряє наявність на старті.
      - name: Integration tests
        env:
          JwtSettings__Secret: ci-only-signing-key-not-a-secret-min-32-chars-long
          JwtSettings__Issuer: EmpireIdle.Tests
          JwtSettings__Audience: EmpireIdle.Tests
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=placeholder"
          Cors__AllowedOrigins__0: http://localhost:5173
        run: >
          dotnet test tests/EmpireIdle.Api.Tests/EmpireIdle.Api.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/TestResults/**'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EmpireIdle.Web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/EmpireIdle.Web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
